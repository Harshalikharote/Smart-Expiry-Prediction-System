
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sales Analytics - Smart Expiry Prediction System</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f7f3fc;
    color: #333;
    padding: 20px;
}

header {
    background: linear-gradient(135deg, #663399, #9b59b6);
    color: white;
    padding: 22px;
    text-align: center;
    border-radius: 12px;
    margin-bottom: 30px;
}

header h1 {
    margin-bottom: 15px;
}

nav {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 13px;
    border-radius: 8px;
    transition: 0.3s;
}

nav a:hover,
nav a.active {
    background: rgba(255,255,255,0.22);
}

.subtitle {
    text-align: center;
    margin: 20px 0;
    color: #666;
}

.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 25px 0;
}

button {
    background: linear-gradient(135deg, #663399, #9b59b6);
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #51277d;
    transform: translateY(-2px);
}

.chart-box {
    max-width: 1000px;
    min-height: 350px;
    margin: 25px auto;
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(70,30,100,0.10);
}

#message {
    text-align: center;
    font-weight: bold;
    margin-top: 15px;
    color: #663399;
}

@media(max-width:600px) {
    body {
        padding: 12px;
    }

    header {
        padding: 18px 10px;
    }

    nav {
        gap: 5px;
    }

    nav a {
        font-size: 13px;
        padding: 8px;
    }

    .chart-box {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Smart Expiry Prediction System</h1>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="product-management.html">Manage Products</a>
        <a href="sales.html">Sales Entry</a>
        <a href="sales-analytics.html" class="active">Sales Analytics</a>
        <a href="reports.html">PDF Reports</a>
    </nav>
</header>

<h1 style="text-align:center; color:#663399;">
    Sales Analytics Dashboard
</h1>

<p class="subtitle">
    Daily, Weekly and Monthly Sales Analysis
</p>

<div class="buttons">
    <button onclick="loadChart('daily')">Daily Sales</button>
    <button onclick="loadChart('weekly')">Weekly Sales</button>
    <button onclick="loadChart('monthly')">Monthly Sales</button>
</div>

<div class="chart-box">
    <canvas id="salesChart"></canvas>
    <p id="message"></p>
</div>

<script>
let chart;

Chart.register(ChartDataLabels);

async function loadChart(type) {

    const message = document.getElementById('message');
    message.textContent = 'Loading...';

    try {

        const response = await fetch(
            `http://localhost:3000/api/analytics/${type}`
        );

        if (!response.ok) {
            throw new Error('Unable to load sales data');
        }

        const data = await response.json();

        if (chart) {
            chart.destroy();
        }

        chart = new Chart(
            document.getElementById('salesChart'),
            {
                type: 'bar',

                data: {
                    labels: data.map(item => item.label),

                    datasets: [{
                        label: 'Quantity Sold',

                        data: data.map(item => item.totalQuantity),

                        backgroundColor: '#9b59b6',
                        borderColor: '#663399',
                        borderWidth: 1,
                        borderRadius: 6,

                        datalabels: {
                            anchor: 'end',
                            align: 'top',
                            color: '#663399',

                            font: {
                                weight: 'bold',
                                size: 14
                            },

                            formatter: function(value) {
                                return value + ' Qty';
                            }
                        }
                    }]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: true,

                    layout: {
                        padding: {
                            top: 25
                        }
                    },

                    plugins: {
                        title: {
                            display: true,
                            text: type.toUpperCase() + ' SALES',
                            color: '#663399',
                            font: {
                                size: 18,
                                weight: 'bold'
                            }
                        },

                        legend: {
                            labels: {
                                color: '#663399'
                            }
                        },

                        datalabels: {
                            display: true
                        }
                    },

                    scales: {
                        y: {
                            beginAtZero: true,

                            title: {
                                display: true,
                                text: 'Quantity Sold'
                            },

                            ticks: {
                                precision: 0
                            }
                        },

                        x: {
                            title: {
                                display: true,
                                text: 'Date / Period'
                            }
                        }
                    }
                }
            }
        );

        message.textContent = data.length
            ? ''
            : 'No sales records available yet.';

    } catch (error) {

        message.textContent = error.message;

    }
}

loadChart('daily');

</script>

</body>
</html>
